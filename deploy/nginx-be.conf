# nginx for the API – only what must be public. The website, admin and SaaS panel call the API on this server
# (http://127.0.0.1:4330 with MS_EDGE_KEY), so nothing else is exposed. Replace nextgrow.pro with your domain.
#   sudo cp BE/deploy/nginx-be.conf /etc/nginx/sites-available/be.nextgrow.pro && sudo ln -sfn ../sites-available/be.nextgrow.pro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
  listen 443 ssl http2;
  server_name be.nextgrow.pro;
  ssl_certificate     /etc/letsencrypt/live/nextgrow.pro/fullchain.pem;     # the wildcard certificate (DEPLOY.md › DNS)
  ssl_certificate_key /etc/letsencrypt/live/nextgrow.pro/privkey.pem;
  client_max_body_size 12m;          # ID photos and uploads

  # headers for every location below (a location must not set its own, or these are dropped)
  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_http_version 1.1; proxy_read_timeout 60s;
  # payment, email and text-message providers call these
  location /webhooks/ { proxy_pass http://127.0.0.1:4330; }
  # signed upload / download addresses (FILES_STORAGE=local)
  location /files/raw/ { proxy_pass http://127.0.0.1:4330; client_max_body_size 26m; }
  # the member app (phones talk to the API directly)
  location /app/ { proxy_pass http://127.0.0.1:4330; }
  location = /health { proxy_pass http://127.0.0.1:4330; access_log off; }
  location / { return 404; }
}
server { listen 80; server_name be.nextgrow.pro; return 301 https://$host$request_uri; }
